apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flaskapp
spec:
  ingressClassName: public
  tls:
    - hosts:
        - flaskapp.localhost
      secretName: flaskapp-tls
  rules:
    - host: flaskapp.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flaskapp
                port:
                  number: 5000
