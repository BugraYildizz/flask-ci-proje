apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaskapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaskapp
  template:
    metadata:
      labels:
        app: flaskapp
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: flaskapp
          image: ${TESTING_IMAGE}
          ports:
            - containerPort: 5000
