apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
spec:
  containers:
    - name: app
      image: yldzzbugra1/flask-ci-proje:latest
      ports:
        - containerPort: 5000

    - name: sidecar
      image: curlimages/curl
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            echo "--- $(date) ---"
            curl -s localhost:5000/health
            echo ""
            sleep 10
          done
