name: 99 Parallel Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  build-test-image:
    name: Build Test Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/bugrayildizz/flask-ci-proje:test-${{ github.run_id }}
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-test:
    name: Unit Tests
    needs: [build-test-image]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          docker run --rm ghcr.io/bugrayildizz/flask-ci-proje:test-${{ github.run_id }}

  integration-test:
    name: Integration Tests
    needs: [build-test-image]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Integration test with Compose
        run: |
          export TESTING_IMAGE=ghcr.io/bugrayildizz/flask-ci-proje:test-${{ github.run_id }}
          docker compose -f docker-compose.test.yml up --exit-code-from sut

  scan-image:
    name: Scan Image
    needs: [build-test-image]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy blocking scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/bugrayildizz/flask-ci-proje:test-${{ github.run_id }}
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os'
          severity: 'HIGH,CRITICAL'
          format: table

  build-final-image:
    name: Build Final Image
    needs: [unit-test, integration-test, scan-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: yldzzbugra1/flask-ci-proje
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
