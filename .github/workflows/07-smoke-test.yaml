name: 07 Smoke Test in k3d

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/bugrayildizz/flask-ci-proje:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create k3d cluster
        uses: AbsaOSS/k3d-action@v2.4.0
        with:
          cluster-name: "smoke-test"
          k3d-version: "v5.5.1"
          args: >-
            --agents 1
            --no-lb
            --k3s-arg "--disable=traefik,servicelb,metrics-server@server:*"

      - name: Deploy and smoke test
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=https://ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}
          export TESTING_IMAGE=ghcr.io/bugrayildizz/flask-ci-proje:"$GITHUB_RUN_ID"
          envsubst < manifests/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment flaskapp --timeout=90s
          kubectl port-forward deploy/flaskapp 5000:5000 &
          sleep 5
          curl --fail localhost:5000/health
