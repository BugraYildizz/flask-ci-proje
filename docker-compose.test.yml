services:
  app:
    image: "${TESTING_IMAGE:-test-img}"
    build:
      context: .
      target: test
    environment:
      DB_HOST: postgres
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
    command: python app.py

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  sut:
    image: "${TESTING_IMAGE:-test-img}"
    build:
      context: .
      target: test
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    command: sh -c "sleep 3 && curl --fail http://app:5000/db"
